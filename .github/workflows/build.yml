name: Build verification

on:
  pull_request:
    paths:
      - "composeApp/**"
      - "androidApp/**"
      - "gradle/**"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/build.yml"

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: commonTest + Android debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.5.0"
      - name: Run common tests and build Android debug APK
        run: gradle --no-daemon :composeApp:testAndroidHostTest :androidApp:assembleDebug
