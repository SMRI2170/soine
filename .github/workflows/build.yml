name: Build verification

on:
  pull_request:
    paths:
      - "composeApp/**"
      - "androidApp/**"
      - "gradle/**"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/build.yml"

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: commonTest + Android debug + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          gradle-version: "9.5.0"
      - name: Run common tests and build Android debug APK
        run: gradle --no-daemon :composeApp:testAndroidHostTest :androidApp:assembleDebug
      - name: Run Android lint
        run: gradle --no-daemon :androidApp:lintDebug
      - name: Upload Android lint report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-lint-report
          path: androidApp/build/reports/lint-results-debug.html
          if-no-files-found: ignore