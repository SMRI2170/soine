name: iOS compile verification

on:
  pull_request:
    paths:
      - "composeApp/**"
      - "iosApp/**"
      - "gradle/**"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/ios.yml"
  push:
    branches: [main]
    paths:
      - "composeApp/**"
      - "iosApp/**"
      - "gradle/**"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

jobs:
  ios-compile:
    name: iOS simulator compile
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.5.0"
      - name: Compile Kotlin for iOS simulator
        run: gradle --no-daemon :composeApp:compileKotlinIosSimulatorArm64
