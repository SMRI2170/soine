name: Shared security gates
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shared-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  security:
    uses: SMRI2170/SMRI2170/.github/workflows/reusable-security.yml@7cdeb265e17900c8475685198d19ff029bd51cda
    permissions:
      contents: read
